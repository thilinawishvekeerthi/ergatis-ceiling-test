openapi: 3.1.0
info:
  title: Talent - Nine-box talent evaluation
  version: 1.0.0
  description: |
    Contract for the BRD "Nine-Box Talent Evaluation" slice. Written before the code (BRD §7).
    All calls need the session cookie (401 without it) and a permission on `assessment:NineBox` (403 without it).
    POST also needs the anti-forgery header `X-XSRF-TOKEN` from `GET /bff/antiforgery`.
    Errors are RFC 9457 ProblemDetails.
servers:
  - url: /
tags:
  - name: NineBox
paths:
  /api/v1/assessment/nine-box/grid:
    get:
      tags: [NineBox]
      operationId: GetNineBoxGrid
      summary: The current nine-box grid with the rubric of each level.
      responses:
        '200':
          description: The grid of the newest published `TALENT_NINE_BOX` config version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NineBoxGrid' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/assessment/nine-box/employees:
    get:
      tags: [NineBox]
      operationId: ListNineBoxEmployees
      summary: One page of employees with their latest placement (FR-1, FR-4, FR-5).
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Ordered by employee number. A fixed number of queries per page (no N+1).
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, totalCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EmployeePlacement' } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalCount: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/assessment/nine-box/employees/{employeeId}/evaluations:
    get:
      tags: [NineBox]
      operationId: ListNineBoxEvaluations
      summary: Full evaluation history of one employee, newest first (FR-5).
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: History page.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, totalCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Evaluation' } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalCount: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/assessment/nine-box/evaluations:
    post:
      tags: [NineBox]
      operationId: CreateNineBoxEvaluation
      summary: Evaluate an employee. The server computes box, label, score and band (FR-3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRequest' }
            example: { employeeId: 3fa85f64-5717-4562-b3fc-2c963f66afa6, performance: 3, potential: 3 }
      responses:
        '201':
          description: Saved. The new evaluation becomes the latest placement unless a newer one exists.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evaluation' }
              example:
                evaluationId: 019a7a3e-0000-7000-8000-000000000001
                employeeId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                performance: 3
                potential: 3
                boxNumber: 9
                label: Star
                talentScore: 9
                band: HIGH
                gridVersionId: 019a7a3e-0000-7000-8000-0000000000aa
                evaluatedBy: dev.admin
                evaluatedAt: '2026-11-12T10:00:00Z'
        '400':
          description: A level is missing or outside 1 to 3 (AC-3).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
              example:
                status: 400
                title: Bad Request
                errors: { performance: ['Performance must be between 1 and 3, but was 4.'] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  responses:
    Problem:
      description: ProblemDetails (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    EvaluateRequest:
      type: object
      required: [employeeId, performance, potential]
      properties:
        employeeId: { type: string, format: uuid }
        performance: { type: integer, minimum: 1, maximum: 3 }
        potential: { type: integer, minimum: 1, maximum: 3 }
    Evaluation:
      type: object
      required: [evaluationId, employeeId, performance, potential, boxNumber, label, talentScore, band, gridVersionId, evaluatedBy, evaluatedAt]
      properties:
        evaluationId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        performance: { type: integer, minimum: 1, maximum: 3 }
        potential: { type: integer, minimum: 1, maximum: 3 }
        boxNumber: { type: integer, minimum: 1, maximum: 9, description: '(potential - 1) * 3 + performance' }
        label: { type: string, description: Box label from the pinned grid version }
        talentScore: { type: integer, minimum: 1, maximum: 9, description: performance * potential }
        band: { type: string, enum: [HIGH, WATCH, LOW] }
        gridVersionId: { type: string, format: uuid, description: Config version the labels came from }
        evaluatedBy: { type: string, description: Stable user id of the reviewer }
        evaluatedAt: { type: string, format: date-time }
    EmployeePlacement:
      type: object
      required: [employeeId, employeeNumber, name]
      properties:
        employeeId: { type: string, format: uuid }
        employeeNumber: { type: string }
        name: { type: string }
        position: { type: [string, 'null'] }
        department: { type: [string, 'null'] }
        latest:
          description: Null when never evaluated, or when the caller may not read talent-confidential data.
          oneOf: [{ $ref: '#/components/schemas/Evaluation' }, { type: 'null' }]
    RubricLevel:
      type: object
      required: [level, label]
      properties:
        level: { type: integer }
        label: { type: string }
        description: { type: [string, 'null'], description: One-line rubric }
    NineBoxCell:
      type: object
      required: [boxNumber, column, row, label, colour, band]
      properties:
        boxNumber: { type: integer, minimum: 1, maximum: 9 }
        column: { type: integer, minimum: 0, maximum: 2, description: performance - 1 }
        row: { type: integer, minimum: 0, maximum: 2, description: potential - 1 }
        label: { type: string }
        colour: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        band: { type: string }
    NineBoxGrid:
      type: object
      required: [gridVersionId, performanceLevels, potentialLevels, columnBounds, rowBounds, cells]
      properties:
        gridVersionId: { type: string, format: uuid }
        performanceLevels: { type: array, items: { $ref: '#/components/schemas/RubricLevel' } }
        potentialLevels: { type: array, items: { $ref: '#/components/schemas/RubricLevel' } }
        columnBounds: { type: array, items: { type: number } }
        rowBounds: { type: array, items: { type: number } }
        cells: { type: array, items: { $ref: '#/components/schemas/NineBoxCell' } }
    Problem:
      type: object
      properties:
        status: { type: integer }
        title: { type: string }
        detail: { type: string }
    ValidationProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            errors:
              type: object
              additionalProperties: { type: array, items: { type: string } }
